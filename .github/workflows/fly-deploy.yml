# Redeploys the Hubergeddon server to Fly.io on every push to main.
# One-time setup: run `fly tokens create deploy` and save the output as a
# GitHub repo secret named FLY_API_TOKEN (Settings > Secrets and variables > Actions).
name: Deploy server to Fly.io
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
